---
- name: Validate Harbor pull secret reconciliation
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    ci_mode: true
    harbor_config_url: "http://127.0.0.1:{{ mock_port }}"
    openbao_config_url: "http://127.0.0.1:{{ mock_port }}"
    service_domains:
      harbor: "harbor.example.com"
      openbao: "bao.example.com"
    harbor:
      admin_password: "test-admin-password"
    harbor_runtime:
      admin_password: "test-admin-password"
    harbor_api_validate_certs: false
    harbor_current_configuration:
      json:
        robot_name_prefix:
          value: "robot$"
    openbao:
      root_token: "test-openbao-token"
    openbao_config:
      validate_certs: false
      secret_engines:
        - path: "secret"
          type: "kv-v2"
    harbor_config:
      pull_secret:
        enabled: true
        name: "ci-cluster-pull"
        description: "CI read-only pull credential"
        rotation_id: "ci-initial"
        openbao:
          mount: "secret"
          path: "shared/harbor/pull"
  tasks:
    - name: Reconcile a missing robot and Vault secret
      ansible.builtin.include_tasks: ../../ansible/roles/harbor_config/tasks/pull-secret.yml

    - name: Reconcile the same desired state again
      ansible.builtin.include_tasks: ../../ansible/roles/harbor_config/tasks/pull-secret.yml

    - name: Read state after idempotent reconciliation
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ mock_port }}/__state"
        return_content: true
      register: initial_state

    - name: Assert creation and idempotence contracts
      ansible.builtin.assert:
        that:
          - initial_state.json.creates == 1
          - initial_state.json.refreshes == 0
          - initial_state.json.updates == 0
          - initial_state.json.vault_writes == 1
          - initial_state.json.robot.permissions == harbor_pull_secret_permissions
          - initial_state.json.vault.username == 'robot$ci-cluster-pull'
          - initial_state.json.vault.rotation_id == 'ci-initial'
          - (initial_state.json.vault['.dockerconfigjson'] | from_json).auths['harbor.example.com'].username == 'robot$ci-cluster-pull'

    - name: Request an explicit pull secret rotation
      ansible.builtin.set_fact:
        harbor_config: "{{ harbor_config | combine({'pull_secret': harbor_config.pull_secret | combine({'rotation_id': 'ci-second'})}, recursive=True) }}"

    - name: Reconcile the rotated pull secret
      ansible.builtin.include_tasks: ../../ansible/roles/harbor_config/tasks/pull-secret.yml

    - name: Read state after rotation
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ mock_port }}/__state"
        return_content: true
      register: rotated_state

    - name: Assert explicit rotation contracts
      ansible.builtin.assert:
        that:
          - rotated_state.json.creates == 1
          - rotated_state.json.refreshes == 1
          - rotated_state.json.vault_writes == 2
          - rotated_state.json.vault.password == 'RefreshedSecret1x'
          - rotated_state.json.vault.rotation_id == 'ci-second'
