services:
  keycloak-db:
    image: pgautoupgrade/pgautoupgrade:18-trixie@sha256:65a2b843dcfec2679a92ece765d7bc243eee9b743ecafcf8a0d181f243c14479
    restart: "no"
    read_only: true
    container_name: keycloak-db
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 1g
    cpus: 2.0
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /var/run/postgresql:size=16m,mode=0775
    command:
      - postgres
      - -c
      - max_wal_size=2GB
      - -c
      - min_wal_size=256MB
      - -c
      - wal_keep_size=128MB
      - -c
      - max_slot_wal_keep_size=512MB
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
    volumes:
      - /srv/admin/data/keycloak/postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "keycloak", "-d", "keycloak"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks:
      - keycloak-db

  keycloak:
    image: keycloak/keycloak:26.7@sha256:26939e1318d6f008fc2ee6e10cec1cf8f1ba8a21846c1bc81b91ed0506bc2a7a
    container_name: keycloak
    restart: "no"
    user: "1000:0"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 512
    mem_limit: 1g
    cpus: 2.0
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /opt/keycloak/data/tmp:size=64m,mode=0700,uid=1000,gid=0
    command: start --health-enabled=true --http-enabled=true --proxy-headers=xforwarded --hostname-strict=false
    environment:
      KC_DB: postgres
      KC_DB_URL_HOST: keycloak-db
      KC_DB_URL_DATABASE: keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "timeout 3 bash -c 'exec 3<>/dev/tcp/127.0.0.1/9000; printf \"GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n\" >&3; head -1 <&3 | grep -q \"200\"'"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 30s
    depends_on:
      keycloak-db:
        condition: service_healthy
    networks:
      - admin-edge
      - keycloak-db

networks:
  admin-edge:
    external: true
  keycloak-db:
    external: true
