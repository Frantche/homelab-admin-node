entryPoints:
  metrics:
    address: ":8082"
  websecure:
    address: ":443"
api:
  dashboard: true
metrics:
  prometheus:
    entryPoint: metrics
ping:
  entryPoint: "websecure"
providers:
  file:
    directory: /etc/traefik/dynamic
    watch: true
{% if crowdsec.enabled | default(false) | bool %}
experimental:
  plugins:
    crowdsec-bouncer:
      moduleName: github.com/maxlerebourg/crowdsec-bouncer-traefik-plugin
      version: "{{ crowdsec.traefik_bouncer.plugin_version | default('v1.4.5') }}"
{% endif %}
log:
  level: INFO
accessLog: {}
