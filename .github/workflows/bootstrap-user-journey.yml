name: bootstrap-user-journey

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, labeled]
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      scope:
        description: Parcours a executer
        required: true
        default: disaster-recovery
        type: choice
        options:
          - disaster-recovery
          - bootstrap
          - all
      candidate_sha:
        description: Immutable candidate commit (defaults to the triggering SHA)
        required: false
        type: string
      promote:
        description: Create the production marker after both DR variants pass
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "0 3 * * 0"

permissions:
  contents: read

concurrency:
  group: admin-node-user-journeys-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Scan repository for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod

      - name: Install static analysis dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc jq openssh-server restic ripgrep shellcheck python3-venv
          python3 -m venv .ci/quality-venv
          .ci/quality-venv/bin/python -m pip install -r ci/requirements-dev.txt
          echo "$PWD/.ci/quality-venv/bin" >> "$GITHUB_PATH"
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          .ci/quality-venv/bin/ansible-galaxy collection install -r ansible/requirements.yml

      - name: Run quality checks
        run: make ci-quality

  oidc-contracts:
    needs: quality
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Ansible
        run: |
          python3 -m pip install --user -r ci/requirements.txt
          ~/.local/bin/ansible-galaxy collection install -r ansible/requirements.yml

      - name: Run OIDC contract tests
        run: |
          ~/.local/bin/ansible-playbook --version
          PATH="$HOME/.local/bin:$PATH" make test-oidc-contracts

  bootstrap:
    if: >-
      github.event_name != 'schedule' &&
      github.event.action != 'labeled' &&
      (github.event_name != 'workflow_dispatch' ||
       inputs.scope == 'bootstrap' ||
       inputs.scope == 'all')
    needs: [quality, oidc-contracts]
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    env:
      VM_NAME: bootstrap-ci
      SSH_PORT: "2222"
      CI_MOCK_PIHOLE: "true"
      CI_MOCK_CLOUDFLARE_TUNNEL: "true"
      CI_SKIP_PUBLIC_URL_VALIDATION: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install host dependencies
        run: |
          sudo sed -i 's#azure.archive.ubuntu.com#archive.ubuntu.com#g' /etc/apt/sources.list /etc/apt/sources.list.d/*.sources 2>/dev/null || true
          sudo apt-get update
          sudo apt-get install -y \
            qemu-system-x86 \
            qemu-utils \
            cloud-image-utils \
            openssh-client \
            sshpass \
            curl \
            jq \
            python3-yaml

      - name: Enable KVM permissions when available
        run: ./ci/enable-kvm.sh

      - name: Download Arch cloud image
        run: |
          set -euo pipefail
          export CI_ARCH_IMAGE="$PWD/.ci/vm/arch.qcow2"
          source ci/lib/arch-vm.sh
          ci_vm_download_image
          qemu-img resize .ci/vm/arch.qcow2 20G

      - name: Generate SSH key
        run: |
          mkdir -p .ci/ssh
          ssh-keygen -t ed25519 -N "" -f .ci/ssh/id_ed25519
          chmod 600 .ci/ssh/id_ed25519

      - name: Prepare cloud-init with repository URL and commit
        env:
          REPO_URL: "${{ github.event.pull_request.head.repo.clone_url || format('https://github.com/{0}.git', github.repository) }}"
          REPO_REF: "${{ github.event.pull_request.head.sha || github.sha }}"
        run: |
          # Inject SSH key, REPO_URL, and the exact commit into the real cloud-init template.
          # The repository is NOT copied into the VM; cloud-init will git clone it.
          python3 ci/render-bootstrap-cloud-init.py

          cat > .ci/vm/meta-data <<METADATA
          instance-id: ${VM_NAME}
          local-hostname: ${VM_NAME}
          METADATA

          cloud-localds .ci/vm/seed.img .ci/vm/user-data .ci/vm/meta-data

      - name: Start Arch VM
        run: |
          KVM_FLAG=""
          CPU_TYPE="qemu64"
          if [ -e /dev/kvm ]; then
            KVM_FLAG="-enable-kvm"
            CPU_TYPE="host"
          fi

          qemu-system-x86_64 \
            ${KVM_FLAG} \
            -m 4096 \
            -smp 2 \
            -cpu ${CPU_TYPE} \
            -nographic \
            -drive file=.ci/vm/arch.qcow2,format=qcow2,if=virtio \
            -drive file=.ci/vm/seed.img,format=raw,if=virtio \
            -netdev user,id=net0,hostfwd=tcp::${SSH_PORT}-:22 \
            -device virtio-net-pci,netdev=net0 \
            -serial mon:stdio \
            &> .ci/vm/qemu.log &

          echo $! > .ci/vm/qemu.pid
          echo "QEMU started with PID $(cat .ci/vm/qemu.pid) (KVM: ${KVM_FLAG:-disabled})"

      - name: Wait for VM SSH to be ready
        timeout-minutes: 15
        run: |
          echo "Waiting for SSH on port ${SSH_PORT}..."
          for i in $(seq 1 180); do
            if ssh -o StrictHostKeyChecking=no -o ConnectTimeout=5 \
                   -o UserKnownHostsFile=/dev/null \
                   -i .ci/ssh/id_ed25519 \
                   -p ${SSH_PORT} admin@127.0.0.1 "echo ready" 2>/dev/null; then
              echo "VM SSH is ready after ${i} attempts"
              break
            fi
            if [[ $i -eq 180 ]]; then
              echo "ERROR: VM did not become ready within 900s"
              tail -50 .ci/vm/qemu.log
              exit 1
            fi
            sleep 5
          done
          initial_boot_id="$(ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            -i .ci/ssh/id_ed25519 -p ${SSH_PORT} admin@127.0.0.1 \
            'cat /proc/sys/kernel/random/boot_id')"
          echo "INITIAL_BOOT_ID=${initial_boot_id}" >> "$GITHUB_ENV"

      - name: Wait for cloud-init upgrade and reboot
        timeout-minutes: 30
        run: |
          # Cannot use `cloud-init status --wait` because cloud-init reinstalls Python
          # during package installation, breaking the CLI. The rolling-release upgrade
          # also requires a reboot before host validation can use the updated kernel.
          echo "Waiting for cloud-init to finish and the upgraded VM to reboot..."
          for j in $(seq 1 360); do
            current_boot_id="$(ssh -o StrictHostKeyChecking=no -o ConnectTimeout=5 \
              -o UserKnownHostsFile=/dev/null -i .ci/ssh/id_ed25519 \
              -p ${SSH_PORT} admin@127.0.0.1 \
              'cat /proc/sys/kernel/random/boot_id' 2>/dev/null || true)"
            if [[ -n "$current_boot_id" && "$current_boot_id" != "$INITIAL_BOOT_ID" ]]; then
              if ssh -o StrictHostKeyChecking=no -o ConnectTimeout=5 \
                     -o UserKnownHostsFile=/dev/null -i .ci/ssh/id_ed25519 \
                     -p ${SSH_PORT} admin@127.0.0.1 \
                     "test -f /var/lib/cloud/instance/boot-finished" 2>/dev/null; then
                echo "Cloud-init completed and VM rebooted after ${j} polling attempts"
                break
              fi
            fi
            if [[ $j -eq 360 ]]; then
              echo "ERROR: cloud-init upgrade and reboot did not complete within 1800s"
              ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
                  -i .ci/ssh/id_ed25519 -p ${SSH_PORT} admin@127.0.0.1 \
                  "cat /var/log/cloud-init-output.log" 2>/dev/null | tail -50
              exit 1
            fi
            sleep 5
          done

      - name: Verify repository cloned in /opt/homelab-admin-node
        run: |
          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
              -i .ci/ssh/id_ed25519 -p ${SSH_PORT} admin@127.0.0.1 \
              "test -d /opt/homelab-admin-node/.git && \
               sudo /opt/homelab-admin-node/scripts/build-admin-node.sh >/dev/null && \
               sudo test -x /opt/homelab-admin-node/bin/admin-node"
          echo "Repository successfully cloned at /opt/homelab-admin-node"

      - name: Verify VM is in locked mode
        run: |
          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
              -i .ci/ssh/id_ed25519 -p ${SSH_PORT} admin@127.0.0.1 \
              "grep -q locked /etc/admin-node/mode"
          echo "VM is in locked mode as expected"

      - name: Initialize CI config repo from examples
        run: |
          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
              -i .ci/ssh/id_ed25519 -p ${SSH_PORT} admin@127.0.0.1 \
              "sudo ADMIN_REPO_URL='https://github.com/${{ github.repository }}.git' \
                    /opt/homelab-admin-node/ci/setup-bootstrap-config-repo.sh"

      - name: Run bootstrap user journey in VM
        timeout-minutes: 45
        run: |
          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
              -i .ci/ssh/id_ed25519 -p ${SSH_PORT} admin@127.0.0.1 \
              "sudo CI_MOCK_PIHOLE=${CI_MOCK_PIHOLE} \
                    CI_MOCK_CLOUDFLARE_TUNNEL=${CI_MOCK_CLOUDFLARE_TUNNEL} \
                    CI_SKIP_PUBLIC_URL_VALIDATION=${CI_SKIP_PUBLIC_URL_VALIDATION} \
                    SKIP_PUBLIC_URL_VALIDATION=true \
                    make -C /opt/homelab-admin-node ci-bootstrap"

      - name: Snapshot validated OTLP mock payloads
        run: |
          mkdir -p .ci/artifacts/bootstrap/otel-mock-validated

          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
              -i .ci/ssh/id_ed25519 -p ${SSH_PORT} admin@127.0.0.1 \
              "sudo tar -C /tmp -czf /tmp/admin-node-otel-mock-validated.tgz admin-node-otel-mock-bootstrap-user-journey && \
               sudo chown admin:admin /tmp/admin-node-otel-mock-validated.tgz && \
               sudo chown -R admin:admin /tmp/admin-node-otel-mock-bootstrap-user-journey"
          scp -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
              -i .ci/ssh/id_ed25519 -P ${SSH_PORT} \
              admin@127.0.0.1:/tmp/admin-node-otel-mock-validated.tgz \
              .ci/artifacts/bootstrap/admin-node-otel-mock-validated.tgz
          scp -r -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
              -i .ci/ssh/id_ed25519 -P ${SSH_PORT} \
              admin@127.0.0.1:/tmp/admin-node-otel-mock-bootstrap-user-journey/. \
              .ci/artifacts/bootstrap/otel-mock-validated/

      - name: Verify validated OTLP mock artifact content
        run: |
          metrics_file=.ci/artifacts/bootstrap/otel-mock-validated/metrics.received

          test -s "$metrics_file"

          for marker in \
            '"key":"service.name","value":{"stringValue":"gitea"}' \
            '"key":"service.name","value":{"stringValue":"harbor-core"}' \
            '"key":"service.name","value":{"stringValue":"harbor-exporter"}' \
            '"key":"service.name","value":{"stringValue":"openbao"}' \
            '"key":"service.name","value":{"stringValue":"traefik"}'
          do
            grep -Fq "$marker" "$metrics_file"
          done

      - name: Ensure AppArmor convergence after reboot
        timeout-minutes: 25
        run: |
          SSH_OPTS=(
            -o StrictHostKeyChecking=no
            -o UserKnownHostsFile=/dev/null
            -i .ci/ssh/id_ed25519
            -p ${SSH_PORT}
          )

          run_ssh() {
            ssh "${SSH_OPTS[@]}" admin@127.0.0.1 "$@"
          }

          wait_for_ssh_up() {
            for i in $(seq 1 120); do
              if run_ssh "echo ready" >/dev/null 2>&1; then
                echo "VM SSH is ready after reboot"
                return 0
              fi
              sleep 5
            done
            echo "ERROR: VM did not come back over SSH after reboot" >&2
            return 1
          }

          wait_for_ssh_down() {
            for i in $(seq 1 60); do
              if ! run_ssh "echo ready" >/dev/null 2>&1; then
                echo "VM SSH went down for reboot"
                return 0
              fi
              sleep 2
            done
            echo "WARNING: VM SSH did not go down while waiting for reboot"
            return 0
          }

          stop_auto_converge() {
            run_ssh "sudo systemctl disable --now admin-converge.timer admin-unlock.path 2>/dev/null || true; sudo systemctl stop admin-converge.service 2>/dev/null || true"
          }

          run_apparmor_converge() {
            run_ssh "sudo CI_MOCK_PIHOLE=${CI_MOCK_PIHOLE} \
                           CI_MOCK_CLOUDFLARE_TUNNEL=${CI_MOCK_CLOUDFLARE_TUNNEL} \
                           CI_SKIP_PUBLIC_URL_VALIDATION=${CI_SKIP_PUBLIC_URL_VALIDATION} \
                           SKIP_PUBLIC_URL_VALIDATION=true \
                           ansible-playbook \
                           -i /etc/admin-config/homelab-node-admin-config/hosts/inventory.ini \
                           /opt/homelab-admin-node/ansible/site.yml \
                           -e @/etc/admin-config/homelab-node-admin-config/hosts/group_vars/ci-bootstrap-vars.yml \
                           -e admin_apparmor_ci_manage_runtime=true \
                           -e admin_apparmor_ci_defer_reboot=true \
                           -e admin_ci_disable_auto_converge=true"
          }

          stop_auto_converge
          echo "Running convergence before AppArmor audit"
          run_apparmor_converge

          if run_ssh '[[ -f /etc/admin-node/apparmor-reboot-requested ]] || [[ "$(cat /sys/module/apparmor/parameters/enabled 2>/dev/null || echo N)" != "Y" ]]'; then
            echo "AppArmor requires a VM reboot before hardening validation"
            run_ssh "sudo shutdown -r now" || true
            wait_for_ssh_down
            wait_for_ssh_up

            stop_auto_converge
            echo "Running post-reboot convergence"
            run_apparmor_converge
          else
            echo "AppArmor is already active; no reboot required"
          fi

          run_ssh 'test "$(cat /sys/module/apparmor/parameters/enabled 2>/dev/null)" = "Y"'

      - name: Run hardening audit in VM
        timeout-minutes: 10
        run: |
          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
              -i .ci/ssh/id_ed25519 -p ${SSH_PORT} admin@127.0.0.1 \
              "sudo /opt/homelab-admin-node/ci/run-hardening-audit.sh"

      - name: Collect hardening audit reports
        if: always()
        run: |
          mkdir -p .ci/artifacts
          if ! scp -r -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
              -i .ci/ssh/id_ed25519 -P ${SSH_PORT} \
              admin@127.0.0.1:/opt/homelab-admin-node/ci/lynis \
              .ci/artifacts/; then
            echo "Hardening audit reports were not available"
          fi

      - name: Upload hardening audit reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: hardening-audit
          path: .ci/artifacts/lynis
          if-no-files-found: ignore
          retention-days: 2

      - name: Collect bootstrap logs
        if: always()
        run: |
          mkdir -p .ci/artifacts/bootstrap

          if [ -f .ci/vm/qemu.log ]; then
            cp .ci/vm/qemu.log .ci/artifacts/bootstrap/qemu.log
          fi

          SSH_OPTS=(
            -o StrictHostKeyChecking=no
            -o UserKnownHostsFile=/dev/null
            -o ConnectTimeout=5
            -i .ci/ssh/id_ed25519
            -p ${SSH_PORT}
          )

          if ssh "${SSH_OPTS[@]}" admin@127.0.0.1 "echo ready" >/dev/null 2>&1; then
            ssh "${SSH_OPTS[@]}" admin@127.0.0.1 "sudo cat /var/log/cloud-init-output.log" \
              > .ci/artifacts/bootstrap/cloud-init-output.log 2>/dev/null || true
            ssh "${SSH_OPTS[@]}" admin@127.0.0.1 "sudo journalctl --no-pager" \
              > .ci/artifacts/bootstrap/journal.log 2>/dev/null || true
            ssh "${SSH_OPTS[@]}" admin@127.0.0.1 "sudo journalctl -u admin-converge.service --no-pager" \
              > .ci/artifacts/bootstrap/admin-converge.log 2>/dev/null || true
            ssh "${SSH_OPTS[@]}" admin@127.0.0.1 "sudo docker ps -a" \
              > .ci/artifacts/bootstrap/docker-ps.txt 2>/dev/null || true
            ssh "${SSH_OPTS[@]}" admin@127.0.0.1 \
              "for c in \$(sudo docker ps -a --format '{{.Names}}'); do echo \"--- \$c ---\"; sudo docker logs \$c 2>&1; done" \
              > .ci/artifacts/bootstrap/docker-logs.txt 2>/dev/null || true
            ssh "${SSH_OPTS[@]}" admin@127.0.0.1 \
              "sudo tar -C /tmp -czf /tmp/admin-node-otel-mock.tgz admin-node-otel-mock-bootstrap-user-journey 2>/dev/null || true"
            scp -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
              -i .ci/ssh/id_ed25519 -P ${SSH_PORT} \
              admin@127.0.0.1:/tmp/admin-node-otel-mock.tgz \
              .ci/artifacts/bootstrap/admin-node-otel-mock.tgz 2>/dev/null || true
            mkdir -p .ci/artifacts/bootstrap/otel-mock
            scp -r -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
              -i .ci/ssh/id_ed25519 -P ${SSH_PORT} \
              admin@127.0.0.1:/tmp/admin-node-otel-mock-bootstrap-user-journey/. \
              .ci/artifacts/bootstrap/otel-mock/ 2>/dev/null || true
            scp -r -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
              -i .ci/ssh/id_ed25519 -P ${SSH_PORT} \
              admin@127.0.0.1:/opt/homelab-admin-node/ci/oidc-user-journey/test-results \
              .ci/artifacts/bootstrap/playwright-test-results 2>/dev/null || true
            scp -r -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
              -i .ci/ssh/id_ed25519 -P ${SSH_PORT} \
              admin@127.0.0.1:/opt/homelab-admin-node/ci/oidc-user-journey/playwright-report \
              .ci/artifacts/bootstrap/playwright-report 2>/dev/null || true
          else
            echo "VM SSH unavailable; only host-side logs were collected" \
              > .ci/artifacts/bootstrap/collection-warning.txt
          fi

      - name: Upload bootstrap logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: bootstrap-user-journey-logs
          path: .ci/artifacts/bootstrap
          if-no-files-found: ignore
          retention-days: 2

      - name: Show VM logs on failure
        if: failure()
        run: |
          echo "=== QEMU log (last 50 lines) ==="
          if [ -f .ci/vm/qemu.log ]; then
            tail -50 .ci/vm/qemu.log
          else
            echo "QEMU log not found"
          fi
          echo ""
          echo "=== Cloud-init output log (last 80 lines) ==="
          if ! ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
              -i .ci/ssh/id_ed25519 -p ${SSH_PORT} admin@127.0.0.1 \
              "cat /var/log/cloud-init-output.log" 2>/dev/null | tail -80; then
            echo "Unable to fetch cloud-init log"
          fi
          echo ""
          echo "=== Docker containers in VM ==="
          if ! ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
              -i .ci/ssh/id_ed25519 -p ${SSH_PORT} admin@127.0.0.1 \
              "sudo docker ps -a" 2>/dev/null; then
            echo "Unable to fetch container list from VM"
          fi
          echo ""
          echo "=== Docker logs ==="
          if ! ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
              -i .ci/ssh/id_ed25519 -p ${SSH_PORT} admin@127.0.0.1 \
              "for c in traefik keycloak keycloak-db openbao harbor-core; do echo \"--- \$c ---\"; sudo docker logs \$c 2>&1 | tail -20; done" 2>/dev/null; then
            echo "Unable to fetch container logs from VM"
          fi

      - name: Stop VM
        if: always()
        run: |
          if [ -f .ci/vm/qemu.pid ]; then
            if ! kill "$(cat .ci/vm/qemu.pid)" 2>/dev/null; then
              echo "QEMU process already stopped"
            fi
          fi

  main-to-candidate-disaster-recovery:
    name: Disaster recovery (${{ matrix.mode }})
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' &&
       (inputs.scope == 'disaster-recovery' || inputs.scope == 'all')) ||
      (github.event_name == 'pull_request' &&
       contains(github.event.pull_request.labels.*.name, 'release-candidate'))
    needs: [quality, oidc-contracts]
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: standard
            include_images: "false"
          - mode: offline-images
            include_images: "true"
    env:
      MAIN_SHA: "${{ github.event.pull_request.base.sha || github.sha }}"
      CANDIDATE_SHA: "${{ inputs.candidate_sha || github.event.pull_request.head.sha || github.sha }}"
      MAIN_REPO_URL: "${{ github.event.pull_request.base.repo.clone_url || format('https://github.com/{0}.git', github.repository) }}"
      CANDIDATE_REPO_URL: "${{ github.event.pull_request.head.repo.clone_url || format('https://github.com/{0}.git', github.repository) }}"
      SSH_PORT: "2222"
      DR_INCLUDE_IMAGES: "${{ matrix.include_images }}"

    steps:
      - name: Checkout candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: "${{ github.event.pull_request.head.repo.full_name || github.repository }}"
          ref: "${{ inputs.candidate_sha || github.event.pull_request.head.sha || github.sha }}"

      - name: Pin exact candidate commit
        run: |
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"

      - name: Install host dependencies
        run: |
          sudo sed -i 's#azure.archive.ubuntu.com#archive.ubuntu.com#g' /etc/apt/sources.list /etc/apt/sources.list.d/*.sources 2>/dev/null || true
          sudo apt-get update
          sudo apt-get install -y \
            qemu-system-x86 \
            qemu-utils \
            cloud-image-utils \
            openssh-client \
            curl \
            jq \
            socat

      - name: Enable KVM permissions when available
        run: ./ci/enable-kvm.sh

      - name: Start ephemeral Garage
        run: ./ci/setup-garage.sh

      - name: Create source VM from main
        run: make ci-dr-action DR_ACTION=create-source

      - name: Deploy and validate main
        run: make ci-dr-action DR_ACTION=deploy-main

      - name: Create immutable service data sentinels
        run: make ci-dr-action DR_ACTION=create-sentinels

      - name: Upgrade main deployment to candidate
        run: make ci-dr-action DR_ACTION=upgrade-candidate

      - name: Reboot candidate and validate hardening
        run: make ci-dr-action DR_ACTION=reboot-candidate-hardening

      - name: Validate upgraded service data and user journeys
        run: make ci-dr-action DR_ACTION=validate-upgraded-candidate

      - name: Rotate technical secrets
        run: make ci-dr-action DR_ACTION=rotate-secrets

      - name: Validate technical secret rotation and service data
        run: make ci-dr-action DR_ACTION=validate-secret-rotation

      - name: Finalize technical secret rotation
        run: make ci-dr-action DR_ACTION=finalize-secret-rotation

      - name: Back up candidate to Garage
        run: make ci-dr-action DR_ACTION=backup-candidate

      - name: Destroy upgraded source VM
        run: make ci-dr-action DR_ACTION=destroy-source

      - name: Create final recovery VM
        run: make ci-dr-action DR_ACTION=create-final-target

      - name: Restore candidate backup from Garage
        run: make ci-dr-action DR_ACTION=restore-candidate

      - name: Validate final restored data and rotated secrets
        run: make ci-dr-action DR_ACTION=validate-final-candidate

      - name: Publish immutable DR evidence
        run: |
          manifest=.ci/artifacts/disaster-recovery/post-rotation-manifest.json
          test -s "$manifest"
          jq -n \
            --arg tested_commit "$CANDIDATE_SHA" \
            --arg variant "${{ matrix.mode }}" \
            --slurpfile backup_manifest "$manifest" \
            '{schema_version: 1, tested_commit: $tested_commit, variant: $variant,
              backup_manifest: $backup_manifest[0],
              restore_validation: {status: "passed", sentinels: "passed", rotated_secrets: "passed", service_validations: "passed"}}' \
            > ".ci/artifacts/disaster-recovery/evidence-${{ matrix.mode }}.json"

      - name: Destroy final recovery VM
        run: make ci-dr-action DR_ACTION=destroy-final-target

      - name: Clean up recovery resources
        if: always()
        run: make ci-dr-action DR_ACTION=cleanup

      - name: Upload immutable DR evidence
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: disaster-recovery-evidence-${{ matrix.mode }}
          path: .ci/artifacts/disaster-recovery/evidence-${{ matrix.mode }}.json
          if-no-files-found: error
          retention-days: 90

      - name: Upload disaster recovery logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: main-to-candidate-disaster-recovery-${{ matrix.mode }}-logs
          path: .ci/artifacts/disaster-recovery
          if-no-files-found: ignore
          retention-days: 2

  promote-tested-candidate:
    name: Promote tested candidate
    if: github.event_name == 'workflow_dispatch' && inputs.promote == true
    needs: [main-to-candidate-disaster-recovery]
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    env:
      CANDIDATE_SHA: "${{ inputs.candidate_sha || github.sha }}"
      GH_TOKEN: "${{ github.token }}"
    steps:
      - name: Checkout promotion tooling at candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: "${{ inputs.candidate_sha || github.sha }}"
          fetch-depth: 0

      - name: Download current-run DR evidence
        run: gh run download "$GITHUB_RUN_ID" --pattern 'disaster-recovery-evidence-*' --dir .ci/dr-evidence

      - name: Refuse stale or incomplete evidence
        run: make validate-dr-promotion DR_EVIDENCE_DIR=.ci/dr-evidence

      - name: Create immutable production marker
        run: |
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          marker="homelab-production-${CANDIDATE_SHA:0:12}"
          if git ls-remote --exit-code --tags origin "refs/tags/$marker" >/dev/null 2>&1; then
            remote_commit="$(git ls-remote origin "refs/tags/$marker^{}" | awk 'NR == 1 {print $1}')"
            test "$remote_commit" = "$CANDIDATE_SHA"
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git tag -a "$marker" "$CANDIDATE_SHA" -m "Homelab production candidate validated by DR run $GITHUB_RUN_ID"
          git push origin "refs/tags/$marker"
