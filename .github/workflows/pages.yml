name: documentation

on:
  push:
    branches:
      - main
    paths:
      - README.md
      - site/**
      - .github/workflows/pages.yml
  pull_request:
    paths:
      - README.md
      - site/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: site/go.mod

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@2752ce1d29631191ea3f27c23495fa06139a5b78 # v3
        with:
          hugo-version: "0.168.0"
          extended: true

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Configure Pages
        id: pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Install documentation dependencies
        working-directory: site
        run: npm ci

      - name: Install Dart Sass
        env:
          DART_SASS_VERSION: "1.106.0"
          DART_SASS_SHA256: 4714f7d5c734b3a76ccf4024d79df41f754b65b3d6e90de2d038b4f3e1e7a604
        run: |
          archive="$RUNNER_TEMP/dart-sass.tar.gz"
          install_dir="$RUNNER_TEMP/dart-sass"
          curl --fail --location --silent --show-error \
            "https://github.com/sass/dart-sass/releases/download/${DART_SASS_VERSION}/dart-sass-${DART_SASS_VERSION}-linux-x64.tar.gz" \
            --output "$archive"
          echo "$DART_SASS_SHA256  $archive" | sha256sum --check
          mkdir -p "$install_dir"
          tar -xzf "$archive" --directory "$install_dir" --strip-components=1
          "$install_dir/sass" --version
          echo "$install_dir" >> "$GITHUB_PATH"

      - name: Build
        env:
          HUGO_BASEURL: "${{ steps.pages.outputs.base_url }}"
        run: make docs-check HUGO_DESTINATION="$GITHUB_WORKSPACE/site/public"

      - name: Upload artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: site/public
          retention-days: 2

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-26.04
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
