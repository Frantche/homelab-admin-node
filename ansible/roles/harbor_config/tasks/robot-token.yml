---
- name: Build Harbor robot token facts
  ansible.builtin.set_fact:
    harbor_pull_secret_cfg: "{{ harbor_robot_token_item }}"
    harbor_pull_secret_openbao_token: >-
      {{
        openbao.root_token | default('', true)
        if (openbao.root_token | default('', true) | length > 0)
        else (openbao_config.root_token | default('', true))
      }}
    harbor_pull_secret_openbao_validate_certs: "{{ openbao_config.validate_certs | default(not (ci_mode | default(false))) }}"
    harbor_pull_secret_kv_v2_mounts: >-
      {{
        openbao_config.secret_engines | default([])
        | selectattr('type', 'equalto', 'kv-v2')
        | map(attribute='path')
        | map('regex_replace', '^/+|/+$', '')
        | list
      }}
  no_log: true

- name: Validate Harbor robot token declaration
  ansible.builtin.assert:
    that:
      - harbor_pull_secret_cfg.name | default('', true) is match('^[A-Za-z0-9][A-Za-z0-9_.-]*$')
      - harbor_pull_secret_cfg.rotation_id | default('', true) | length > 0
      - harbor_pull_secret_cfg.mode | default('', true) in ['pull', 'pull_push']
      - harbor_pull_secret_cfg.projects | default([]) is sequence
      - harbor_pull_secret_cfg.projects | default([]) | length > 0
      - harbor_pull_secret_cfg.projects | unique | length == harbor_pull_secret_cfg.projects | length
      - harbor_pull_secret_cfg.projects | reject('match', '^(\*|[a-z0-9][a-z0-9._-]*)$') | list | length == 0
      - "('*' not in harbor_pull_secret_cfg.projects) or (harbor_pull_secret_cfg.projects | length == 1)"
      - harbor_pull_secret_cfg.openbao.mount | default('', true) | length > 0
      - harbor_pull_secret_cfg.openbao.path | default('', true) | length > 0
      - "'..' not in harbor_pull_secret_cfg.openbao.path.split('/')"
      - (harbor_pull_secret_cfg.openbao.mount | regex_replace('^/+|/+$', '')) in harbor_pull_secret_kv_v2_mounts
      - harbor_pull_secret_openbao_token | length > 0
    fail_msg: >-
      Each harbor_config.robot_tokens item requires a safe name, a unique list
      of project names (or only "*"), mode pull or pull_push, rotation_id, an
      OpenBao KV-v2 destination, and an OpenBao root/config token.
  no_log: true

- name: Normalize Harbor robot token declaration
  ansible.builtin.set_fact:
    harbor_pull_secret_mount: "{{ harbor_pull_secret_cfg.openbao.mount | regex_replace('^/+|/+$', '') }}"
    harbor_pull_secret_path: "{{ harbor_pull_secret_cfg.openbao.path | regex_replace('^/+|/+$', '') }}"
    harbor_pull_secret_projects: "{{ harbor_pull_secret_cfg.projects | unique | list }}"
    harbor_pull_secret_access: >-
      {{
        [{'resource': 'repository', 'action': 'pull'}]
        + ([{'resource': 'repository', 'action': 'push'}]
           if harbor_pull_secret_cfg.mode == 'pull_push' else [])
      }}
    harbor_pull_secret_robot_prefix: >-
      {{
        harbor_current_configuration.json.robot_name_prefix.value
        if harbor_current_configuration.json.robot_name_prefix is mapping
        else (harbor_current_configuration.json.robot_name_prefix | default('robot$', true))
      }}
  no_log: true

- name: Reset Harbor robot token permissions
  ansible.builtin.set_fact:
    harbor_pull_secret_permissions: []
  no_log: true

- name: Build Harbor robot token permissions
  ansible.builtin.set_fact:
    harbor_pull_secret_permissions: >-
      {{
        harbor_pull_secret_permissions
        + [{
          'kind': 'project',
          'namespace': item,
          'access': harbor_pull_secret_access
        }]
      }}
  loop: "{{ harbor_pull_secret_projects }}"
  no_log: true

- name: Read Harbor robot token from OpenBao
  ansible.builtin.uri:
    url: "{{ openbao_config_url | default('https://' ~ service_domains.openbao) }}/v1/{{ harbor_pull_secret_mount }}/data/{{ harbor_pull_secret_path }}"
    method: GET
    headers:
      X-Vault-Token: "{{ harbor_pull_secret_openbao_token }}"
    validate_certs: "{{ harbor_pull_secret_openbao_validate_certs }}"
    status_code: [200, 404]
  register: harbor_pull_secret_openbao_current
  changed_when: false
  no_log: true

- name: Normalize current Harbor robot token data
  ansible.builtin.set_fact:
    harbor_pull_secret_openbao_data: "{{ harbor_pull_secret_openbao_current.json.data.data | default({}) }}"
  no_log: true

- name: List Harbor system robot accounts
  ansible.builtin.uri:
    url: "{{ harbor_config_url | default('https://' ~ service_domains.harbor) }}/api/v2.0/robots?q=Level%3Dsystem&page=1&page_size=100"
    method: GET
    user: admin
    password: "{{ harbor_runtime.admin_password | default(harbor.admin_password | mandatory('harbor.admin_password is required')) }}"
    force_basic_auth: true
    validate_certs: "{{ harbor_api_validate_certs }}"
    status_code: 200
  register: harbor_pull_secret_robots_response
  changed_when: false
  no_log: true

- name: Select the configured Harbor robot
  ansible.builtin.set_fact:
    harbor_pull_secret_full_name: "{{ harbor_pull_secret_robot_prefix ~ harbor_pull_secret_cfg.name }}"
    harbor_pull_secret_matching_robots: >-
      {{
        harbor_pull_secret_robots_response.json
        | selectattr('name', 'equalto', harbor_pull_secret_robot_prefix ~ harbor_pull_secret_cfg.name)
        | list
      }}
  no_log: true

- name: Refuse ambiguous Harbor robots
  ansible.builtin.assert:
    that:
      - harbor_pull_secret_matching_robots | length <= 1
    fail_msg: "Multiple Harbor system robots match {{ harbor_pull_secret_full_name }}; reconcile them manually."
  no_log: true

- name: Record whether the Harbor robot must be created
  ansible.builtin.set_fact:
    harbor_pull_secret_was_created: "{{ harbor_pull_secret_matching_robots | length == 0 }}"

- name: Create the Harbor robot
  ansible.builtin.uri:
    url: "{{ harbor_config_url | default('https://' ~ service_domains.harbor) }}/api/v2.0/robots"
    method: POST
    user: admin
    password: "{{ harbor_runtime.admin_password | default(harbor.admin_password | mandatory('harbor.admin_password is required')) }}"
    force_basic_auth: true
    validate_certs: "{{ harbor_api_validate_certs }}"
    body_format: json
    body:
      name: "{{ harbor_pull_secret_cfg.name }}"
      description: "{{ harbor_pull_secret_cfg.description | default('Managed Harbor robot credential') }}"
      level: "system"
      disable: false
      duration: -1
      permissions: "{{ harbor_pull_secret_permissions }}"
    status_code: 201
  register: harbor_pull_secret_created_robot
  when: harbor_pull_secret_was_created | bool
  no_log: true

- name: Select the effective Harbor robot
  ansible.builtin.set_fact:
    harbor_pull_secret_robot: >-
      {{
        harbor_pull_secret_created_robot.json
        if harbor_pull_secret_was_created
        else (harbor_pull_secret_matching_robots | first)
      }}
  no_log: true

- name: Update drifted Harbor robot metadata and permissions
  ansible.builtin.uri:
    url: "{{ harbor_config_url | default('https://' ~ service_domains.harbor) }}/api/v2.0/robots/{{ harbor_pull_secret_robot.id }}"
    method: PUT
    user: admin
    password: "{{ harbor_runtime.admin_password | default(harbor.admin_password | mandatory('harbor.admin_password is required')) }}"
    force_basic_auth: true
    validate_certs: "{{ harbor_api_validate_certs }}"
    body_format: json
    body: >-
      {{
        harbor_pull_secret_robot
        | combine({
            'description': harbor_pull_secret_cfg.description | default('Managed Harbor robot credential'),
            'disable': false,
            'duration': -1,
            'permissions': harbor_pull_secret_permissions
          })
      }}
    status_code: 200
  when:
    - not harbor_pull_secret_was_created | bool
    - >-
      harbor_pull_secret_robot.description | default('') != harbor_pull_secret_cfg.description | default('Managed Harbor robot credential')
      or harbor_pull_secret_robot.disable | default(false) | bool
      or harbor_pull_secret_robot.expires_at | default(-1) | int != -1
      or harbor_pull_secret_robot.permissions | default([]) != harbor_pull_secret_permissions
  no_log: true

- name: Determine whether the Harbor robot token must rotate
  ansible.builtin.set_fact:
    harbor_pull_secret_rotation_required: >-
      {{
        harbor_pull_secret_was_created
        or harbor_pull_secret_openbao_current.status == 404
        or (harbor_pull_secret_openbao_data.username | default('') != harbor_pull_secret_robot.name)
        or (harbor_pull_secret_openbao_data.password | default('', true) | length == 0)
        or (harbor_pull_secret_openbao_data.rotation_id | default('') != harbor_pull_secret_cfg.rotation_id)
      }}
  no_log: true

- name: Refresh an existing Harbor robot token
  ansible.builtin.uri:
    url: "{{ harbor_config_url | default('https://' ~ service_domains.harbor) }}/api/v2.0/robots/{{ harbor_pull_secret_robot.id }}"
    method: PATCH
    user: admin
    password: "{{ harbor_runtime.admin_password | default(harbor.admin_password | mandatory('harbor.admin_password is required')) }}"
    force_basic_auth: true
    validate_certs: "{{ harbor_api_validate_certs }}"
    body_format: json
    body: {}
    status_code: 200
  register: harbor_pull_secret_refreshed
  when:
    - harbor_pull_secret_rotation_required | bool
    - not harbor_pull_secret_was_created | bool
  no_log: true

- name: Build Harbor robot credential facts
  ansible.builtin.set_fact:
    harbor_pull_secret_username: "{{ harbor_pull_secret_robot.name }}"
    harbor_pull_secret_password: >-
      {{
        harbor_pull_secret_created_robot.json.secret
        if harbor_pull_secret_was_created
        else (
          harbor_pull_secret_refreshed.json.secret
          if harbor_pull_secret_rotation_required
          else harbor_pull_secret_openbao_data.password
        )
      }}
  no_log: true

- name: Build Harbor robot token payload
  ansible.builtin.set_fact:
    harbor_pull_secret_payload:
      registry: "{{ service_domains.harbor }}"
      username: "{{ harbor_pull_secret_username }}"
      password: "{{ harbor_pull_secret_password }}"
      auth: "{{ (harbor_pull_secret_username ~ ':' ~ harbor_pull_secret_password) | b64encode }}"
      rotation_id: "{{ harbor_pull_secret_cfg.rotation_id }}"
      mode: "{{ harbor_pull_secret_cfg.mode }}"
      projects: "{{ harbor_pull_secret_projects }}"
      .dockerconfigjson: >-
        {{
          {
            'auths': {
              service_domains.harbor: {
                'username': harbor_pull_secret_username,
                'password': harbor_pull_secret_password,
                'auth': (harbor_pull_secret_username ~ ':' ~ harbor_pull_secret_password) | b64encode
              }
            }
          } | to_json
        }}
  no_log: true

- name: Publish Harbor robot token to OpenBao
  ansible.builtin.uri:
    url: "{{ openbao_config_url | default('https://' ~ service_domains.openbao) }}/v1/{{ harbor_pull_secret_mount }}/data/{{ harbor_pull_secret_path }}"
    method: POST
    headers:
      X-Vault-Token: "{{ harbor_pull_secret_openbao_token }}"
    validate_certs: "{{ harbor_pull_secret_openbao_validate_certs }}"
    body_format: json
    body:
      data: "{{ harbor_pull_secret_payload }}"
    status_code: [200, 204]
  when: harbor_pull_secret_openbao_data != harbor_pull_secret_payload
  no_log: true
