---
- name: Ensure admin repository operator group exists
  ansible.builtin.group:
    name: "{{ admin_node_repo_group }}"
    state: present
    system: true

- name: Ensure base directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner | default('root') }}"
    group: "{{ item.group | default('root') }}"
    mode: "{{ item.mode | default('0755') }}"
  loop:
    - { path: /opt/homelab-admin-node, owner: "{{ admin_node_repo_owner }}", group: "{{ admin_node_repo_group }}", mode: "2775" }
    - { path: /etc/admin-node }
    - { path: "{{ admin_node_root }}" }
    - { path: "{{ admin_node_root }}/stacks" }
    - { path: "{{ admin_node_root }}/env", mode: "0700" }
    - { path: "{{ admin_node_root }}/data" }
    - { path: "{{ admin_node_root }}/backups" }

- name: Render admin-node runtime environment
  ansible.builtin.template:
    src: runtime-env.j2
    dest: /etc/admin-node/runtime.env
    owner: root
    group: root
    mode: "0644"

- name: Resolve admin repository source
  ansible.builtin.command:
    argv:
      - realpath
      - "{{ playbook_dir }}/.."
  register: admin_node_repo_source
  changed_when: false

- name: Sync repository into /opt when source and target differ
  ansible.posix.synchronize:
    src: "{{ playbook_dir }}/../"
    dest: /opt/homelab-admin-node/
    rsync_opts:
      - "--delete"
      - "--chown={{ admin_node_repo_owner }}:{{ admin_node_repo_group }}"
      - "--exclude=secrets/*.sops.yaml"
      - "--exclude=ansible/group_vars/secrets.sops.yaml"
  when: admin_node_repo_source.stdout != "/opt/homelab-admin-node"

- name: Normalize tracked admin repository permissions
  ansible.builtin.command:
    argv:
      - /opt/homelab-admin-node/scripts/normalize-repo-permissions.sh
      - /opt/homelab-admin-node
      - "{{ admin_node_repo_owner }}"
      - "{{ admin_node_repo_group }}"
  changed_when: false

- name: Ensure root Go cache directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0700"
  loop:
    - /var/cache/admin-node/go-build
    - /var/cache/admin-node/go-mod
    - /var/cache/admin-node/go-path

- name: Build admin-node Go CLI
  ansible.builtin.command: ./scripts/build-admin-node.sh
  args:
    chdir: /opt/homelab-admin-node
  environment:
    GOCACHE: /var/cache/admin-node/go-build
    GOMODCACHE: /var/cache/admin-node/go-mod
    GOPATH: /var/cache/admin-node/go-path
    GOTOOLCHAIN: auto
  register: admin_node_build
  changed_when: "'changed=true' in admin_node_build.stdout"

- name: Compute admin repository operator users
  ansible.builtin.set_fact:
    admin_node_repo_operator_users_effective: "{{ hardening.ssh.allow_users | default(['admin'], true) }}"

- name: Check admin repository operator users
  ansible.builtin.command:
    argv:
      - getent
      - passwd
      - "{{ item }}"
  loop: "{{ admin_node_repo_operator_users_effective }}"
  register: admin_node_repo_operator_user_checks
  changed_when: false
  failed_when: false

- name: Add existing operator users to admin repository group
  ansible.builtin.user:
    name: "{{ item.item }}"
    groups: "{{ admin_node_repo_group }}"
    append: true
  loop: "{{ admin_node_repo_operator_user_checks.results }}"
  when: item.rc == 0

- name: Configure admin repository for shared Git access
  ansible.builtin.command:
    argv:
      - git
      - --git-dir=/opt/homelab-admin-node/.git
      - --work-tree=/opt/homelab-admin-node
      - config
      - core.sharedRepository
      - group
  changed_when: false

- name: Keep admin repository Git config group-writable
  ansible.builtin.file:
    path: /opt/homelab-admin-node/.git/config
    owner: "{{ admin_node_repo_owner }}"
    group: "{{ admin_node_repo_group }}"
    mode: "0664"

- name: Deploy systemd unit files
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../systemd/{{ item }}"
    dest: /etc/systemd/system/{{ item }}
    owner: root
    group: root
    mode: "0644"
  loop:
    - admin-stack@.service
    - admin-stacks.target
    - admin-converge.service
    - admin-backup.service
    - admin-backup.timer
    - admin-backup-status.service
    - admin-backup-status.timer
    - admin-backup-integrity.service
    - admin-backup-integrity.timer
    - admin-backup-failure@.service
    - admin-offline-backup.service
    - admin-gitea-process-backup.service
    - admin-unlock.path
  notify: systemd daemon-reload

- name: Deploy Gitea process backup timer
  ansible.builtin.template:
    src: admin-gitea-process-backup.timer.j2
    dest: /etc/systemd/system/admin-gitea-process-backup.timer
    owner: root
    group: root
    mode: "0644"
  notify: systemd daemon-reload

- name: Deploy offline backup timer
  ansible.builtin.template:
    src: admin-offline-backup.timer.j2
    dest: /etc/systemd/system/admin-offline-backup.timer
    owner: root
    group: root
    mode: "0644"
  notify: systemd daemon-reload

- name: Deploy admin-converge timer
  ansible.builtin.template:
    src: admin-converge.timer.j2
    dest: /etc/systemd/system/admin-converge.timer
    owner: root
    group: root
    mode: "0644"
  notify: systemd daemon-reload

- name: Validate system update configuration
  ansible.builtin.assert:
    that:
      - ((system_updates | default({})).on_calendar | default('Sat *-*-* 04:00:00') | trim | length) > 0
      - ((system_updates | default({})).operation_lock_timeout_sec | default(1800) | int) > 0
      - ((system_updates | default({})).service_timeout_sec | default(7200) | int) > 0
    fail_msg: System update schedule and timeouts must be valid positive values.

- name: Deploy system update units
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - admin-system-update.service
    - admin-system-update.timer
  notify: systemd daemon-reload

- name: Apply updated systemd unit definitions before activation
  ansible.builtin.meta: flush_handlers

- name: Ensure admin-converge drop-in directory is inspectable
  ansible.builtin.file:
    path: /etc/systemd/system/admin-converge.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Check admin-converge inventory drop-in
  ansible.builtin.stat:
    path: /etc/systemd/system/admin-converge.service.d/10-inventory.conf
  register: admin_converge_inventory_dropin

- name: Make admin-converge inventory drop-in inspectable
  ansible.builtin.file:
    path: /etc/systemd/system/admin-converge.service.d/10-inventory.conf
    owner: root
    group: root
    mode: "0644"
  when: admin_converge_inventory_dropin.stat.exists

- name: Enable and start admin-stacks.target
  ansible.builtin.systemd:
    name: admin-stacks.target
    enabled: true

- name: Enable admin-backup.timer
  ansible.builtin.systemd:
    name: admin-backup.timer
    enabled: "{{ admin_mode == 'normal' }}"
    state: "{{ (admin_mode == 'normal') | ternary('started', 'stopped') }}"

- name: Enable backup monitoring timers
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: "{{ admin_mode == 'normal' }}"
    state: "{{ (admin_mode == 'normal') | ternary('started', 'stopped') }}"
  loop:
    - admin-backup-status.timer
    - admin-backup-integrity.timer

- name: Configure Gitea process backup timer
  ansible.builtin.systemd:
    name: admin-gitea-process-backup.timer
    enabled: "{{ (admin_mode == 'normal') and ((backup | default({})).gitea_process.enabled | default(false) | bool) }}"
    state: "{{ ((admin_mode == 'normal') and ((backup | default({})).gitea_process.enabled | default(false) | bool)) | ternary('started', 'stopped') }}"

- name: Disable offline backup timer when it is not operational
  ansible.builtin.systemd:
    name: admin-offline-backup.timer
    enabled: false
    state: stopped
  when: not ((admin_mode == 'normal') and ((backup | default({})).offline.enabled | default(false) | bool))

- name: Enable admin-converge.timer
  ansible.builtin.systemd:
    name: admin-converge.timer
    enabled: true
    state: started
  when: not (admin_ci_disable_auto_converge | default(false) | bool)

- name: Configure weekly system updates
  ansible.builtin.systemd:
    name: admin-system-update.timer
    enabled: "{{ (system_updates | default({})).enabled | default(true) | bool }}"
    state: "{{ ((system_updates | default({})).enabled | default(true) | bool) | ternary('started', 'stopped') }}"

- name: Enable admin-unlock.path
  ansible.builtin.systemd:
    name: admin-unlock.path
    enabled: true
    state: started
  when: not (admin_ci_disable_auto_converge | default(false) | bool)

- name: Disable automatic convergence triggers when requested
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: false
    state: stopped
  loop:
    - admin-converge.timer
    - admin-unlock.path
  when: admin_ci_disable_auto_converge | default(false) | bool
