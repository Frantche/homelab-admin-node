---
- name: Build effective restic repository list
  ansible.builtin.set_fact:
    backup_restic_repositories_effective: >-
      {{
        backup.restic_repositories
        if backup.restic_repositories is defined
        else (
          (backup.restic_repositories_map | dict2items | map(attribute='value') | list)
          if backup.restic_repositories_map is defined
          else
          (
            [{
              'name': 'default',
              'repository': backup.restic_repository,
              'password': backup.restic_password | default(''),
              'forget_args': backup.restic_forget_args | default('--keep-last 3 --prune')
            }]
            if (backup.restic_repository | default('', true) | length > 0)
            else []
          )
        )
      }}
  no_log: true

- name: Validate offline backup policy and recovery-kit attestations
  ansible.builtin.assert:
    that:
      - (backup.offline.retention | default(2) | int) >= 1
      - (backup.offline.minimum_free_bytes | default(32212254720) | int) >= 1073741824
      - backup.require_remote_repository | default(true) | bool
      - >-
        backup.offline.max_age | default('192h') | string
        is match(offline_positive_duration_pattern)
      - >-
        not ((backup.offline.max_age | default('192h') | string)
        is match(offline_zero_duration_pattern))
      - >-
        backup.offline.recovery_kit_max_age | default('2160h') | string
        is match(offline_positive_duration_pattern)
      - >-
        not ((backup.offline.recovery_kit_max_age | default('2160h') | string)
        is match(offline_zero_duration_pattern))
      - >-
        ((backup.offline.recovery_kit | default({})).keys()
        | difference([
          'last_verified_at',
          'age_identity_offsite',
          'config_repo_access_tested',
          'restic_access_offsite',
          'openbao_recovery_offsite',
          'separation_of_duties_verified'
        ]) | length) == 0
      - >-
        backup.offline.recovery_kit.last_verified_at | default('')
        is match('^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$')
      - >-
        (backup.offline.recovery_kit.last_verified_at | default('')
        | to_datetime('%Y-%m-%dT%H:%M:%SZ')).strftime('%Y-%m-%dT%H:%M:%SZ')
        == backup.offline.recovery_kit.last_verified_at
      - >-
        ((now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') | to_datetime('%Y-%m-%dT%H:%M:%SZ'))
        - (backup.offline.recovery_kit.last_verified_at
        | to_datetime('%Y-%m-%dT%H:%M:%SZ'))).total_seconds() >= 0
      - backup.offline.recovery_kit.age_identity_offsite | default(false) | bool
      - backup.offline.recovery_kit.config_repo_access_tested | default(false) | bool
      - backup.offline.recovery_kit.restic_access_offsite | default(false) | bool
      - backup.offline.recovery_kit.openbao_recovery_offsite | default(false) | bool
      - backup.offline.recovery_kit.separation_of_duties_verified | default(false) | bool
    fail_msg: >-
      backup.offline is enabled but retention/capacity, mandatory remote delivery,
      or the strictly secret-free recovery-kit attestations are invalid. Complete
      the published offline recovery checklist and remove every undocumented key.
  when: backup.offline.enabled | default(false) | bool
  vars:
    offline_positive_duration_pattern: '^\+?(?:(?:[0-9]+(?:\.[0-9]*)?|\.[0-9]+)(?:ns|us|µs|μs|ms|s|m|h))+$'
    offline_zero_duration_pattern: '^\+?(?:0+(?:\.0+)?(?:ns|us|µs|μs|ms|s|m|h))+$|^\+?0$'

- name: Render backup environment
  ansible.builtin.template:
    src: backup-env.j2
    dest: /srv/admin/env/backup.env
    owner: root
    group: root
    mode: "0600"
  no_log: true

- name: Render secret-free recovery-kit inventory
  ansible.builtin.copy:
    dest: /etc/admin-node/recovery-kit-inventory.json
    owner: root
    group: root
    mode: "0644"
    content: "{{ (backup.offline.recovery_kit | default({})) | to_nice_json }}\n"
  when: backup.offline.enabled | default(false) | bool

- name: Enable offline backup timer after its policy is ready
  ansible.builtin.systemd:
    name: admin-offline-backup.timer
    enabled: true
    state: started
    daemon_reload: true
  when:
    - admin_mode == 'normal'
    - backup.offline.enabled | default(false) | bool

- name: Validate Gitea process backup configuration
  ansible.builtin.assert:
    that:
      - backup.gitea_process.method | default('') in ['s3', 'ftp']
      - >
        (backup.gitea_process.method | default('')) != 's3'
        or (
          backup.gitea_process.endpoint_url | default('') | length > 0
          and backup.gitea_process.bucket | default('') | length > 0
          and backup.gitea_process.aws_access_key_id | default('') | length > 0
          and backup.gitea_process.aws_secret_access_key | default('') | length > 0
        )
      - >
        (backup.gitea_process.method | default('')) != 'ftp'
        or (
          backup.gitea_process.ftp_host | default('') | length > 0
          and backup.gitea_process.ftp_user | default('') | length > 0
          and backup.gitea_process.ftp_password | default('') | length > 0
        )
    fail_msg: "backup.gitea_process is enabled but its backend configuration is incomplete."
  when: backup.gitea_process.enabled | default(false) | bool
  no_log: true

- name: Render Gitea process backup environment
  ansible.builtin.template:
    src: gitea-process-backup-env.j2
    dest: /srv/admin/env/gitea-process-backup.env
    owner: root
    group: root
    mode: "0600"
  when: backup.gitea_process.enabled | default(false) | bool
  no_log: true

- name: Validate Gitea process backup writable paths
  ansible.builtin.assert:
    that:
      - item.startswith('/')
      - (item | dirname) != '/'
    fail_msg: "Gitea process backup writable paths must be absolute and cannot be direct children of filesystem root."
  loop:
    - "{{ backup.gitea_process.tmp_folder | default('/srv/admin/backups/gitea-process/tmp', true) }}"
    - "{{ backup.gitea_process.restore_tmp_folder | default('/srv/admin/backups/gitea-process/restore-tmp', true) }}"
    - "{{ backup.gitea_process.backup_file_log | default('/srv/admin/backups/gitea-process/history/backupFileLog.txt', true) }}"
  when: backup.gitea_process.enabled | default(false) | bool

- name: Ensure Gitea process backup scratch directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0700"
  loop:
    - "{{ backup.gitea_process.tmp_folder | default('/srv/admin/backups/gitea-process/tmp', true) }}"
    - "{{ backup.gitea_process.restore_tmp_folder | default('/srv/admin/backups/gitea-process/restore-tmp', true) }}"
    - "{{ backup.gitea_process.backup_file_log | default('/srv/admin/backups/gitea-process/history/backupFileLog.txt', true) | dirname }}"
  when: backup.gitea_process.enabled | default(false) | bool
