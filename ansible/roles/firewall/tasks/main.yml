---
- name: Deploy nftables firewall policy
  ansible.builtin.template:
    src: nftables.conf.j2
    dest: /etc/nftables.conf
    owner: root
    group: root
    mode: "0644"
    validate: nft -c -f %s
  notify: Reload nftables

- name: Enable nftables at boot
  ansible.builtin.systemd:
    name: nftables
    enabled: true

- name: Inspect active nftables policy
  ansible.builtin.command:
    argv:
      - nft
      - list
      - table
      - inet
      - admin_filter
  register: nftables_admin_policy
  changed_when: false
  failed_when: false

- name: Load nftables policy when it is missing
  ansible.builtin.systemd:
    name: nftables
    state: started
  when: nftables_admin_policy.rc != 0
