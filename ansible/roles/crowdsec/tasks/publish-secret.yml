---
- name: Read current CrowdSec credential from OpenBao
  ansible.builtin.uri:
    url: "{{ openbao_config_url | default('https://' ~ service_domains.openbao) }}/v1/{{ crowdsec_openbao_mount }}/data/{{ crowdsec_openbao_credential.path }}"
    method: GET
    headers:
      X-Vault-Token: "{{ crowdsec_openbao_token }}"
    validate_certs: "{{ crowdsec_openbao_validate_certs }}"
    status_code: [200, 404]
  register: crowdsec_openbao_current_credential
  changed_when: false
  no_log: true

- name: Publish CrowdSec credential to OpenBao
  ansible.builtin.uri:
    url: "{{ openbao_config_url | default('https://' ~ service_domains.openbao) }}/v1/{{ crowdsec_openbao_mount }}/data/{{ crowdsec_openbao_credential.path }}"
    method: POST
    headers:
      X-Vault-Token: "{{ crowdsec_openbao_token }}"
    validate_certs: "{{ crowdsec_openbao_validate_certs }}"
    body_format: json
    body:
      data: "{{ crowdsec_openbao_credential.data }}"
    status_code: [200, 204]
  when: >-
    crowdsec_openbao_current_credential.status == 404
    or crowdsec_openbao_current_credential.json.data.data | default({}) != crowdsec_openbao_credential.data
  no_log: true
