---
- name: Validate CrowdSec Web UI configuration
  ansible.builtin.assert:
    that:
      - crowdsec.enabled | default(false) | bool
      - crowdsec_web_ui.hostname | default('', true) | length > 0
      - crowdsec_web_ui.lapi.username | default('', true) | length > 0
      - crowdsec_web_ui.lapi.password | default('', true) | length > 0
      - crowdsec_web_ui.oidc.enabled | default(false) | bool
      - crowdsec_web_ui.oidc.client_id | default('', true) | length > 0
      - crowdsec_web_ui.oidc.client_secret | default('', true) | length > 0
      - crowdsec_web_ui.oidc.issuer_url | default('', true) | length > 0
    fail_msg: "CrowdSec Web UI requires LAPI credentials and an OIDC client configuration."
  no_log: true

- name: Ensure CrowdSec Web UI directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: root
    group: root
    mode: "{{ item.mode }}"
  loop:
    - { path: "{{ admin_node_root }}/stacks/crowdsec-web-ui", mode: "0755" }
    - { path: "{{ admin_node_root }}/data/crowdsec-web-ui", mode: "0750" }
    - { path: "{{ admin_node_root }}/env", mode: "0750" }

- name: Register CrowdSec Web UI watcher
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - crowdsec
      - cscli
      - machines
      - add
      - "{{ crowdsec_web_ui.lapi.username }}"
      - --password
      - "{{ crowdsec_web_ui.lapi.password }}"
      - -f
      - /dev/null
  register: crowdsec_web_ui_machine
  changed_when: crowdsec_web_ui_machine.rc == 0
  failed_when: >-
    crowdsec_web_ui_machine.rc != 0 and
    ('already exist' not in (crowdsec_web_ui_machine.stderr | lower))
  no_log: true

- name: Write CrowdSec Web UI secrets
  ansible.builtin.copy:
    content: "{{ item.value }}\n"
    dest: "{{ admin_node_root }}/env/{{ item.name }}"
    owner: root
    group: root
    mode: "0600"
  loop:
    - { name: crowdsec-web-ui-lapi-password, value: "{{ crowdsec_web_ui.lapi.password }}" }
    - { name: crowdsec-web-ui-oidc-client-secret, value: "{{ crowdsec_web_ui.oidc.client_secret }}" }
  no_log: true

- name: Render CrowdSec Web UI compose
  ansible.builtin.template:
    src: "{{ playbook_dir }}/../stacks/crowdsec-web-ui/compose.yaml.j2"
    dest: "{{ admin_node_root }}/stacks/crowdsec-web-ui/compose.yaml"
    owner: root
    group: root
    mode: "0644"

- name: Start CrowdSec Web UI stack
  ansible.builtin.command:
    argv: [docker, compose, -f, compose.yaml, up, --remove-orphans, --wait, --wait-timeout, "300"]
  args:
    chdir: "{{ admin_node_root }}/stacks/crowdsec-web-ui"
  register: crowdsec_web_ui_stack
  changed_when: "'Created' in crowdsec_web_ui_stack.stderr or 'Recreated' in crowdsec_web_ui_stack.stderr or 'Started' in crowdsec_web_ui_stack.stderr"

- name: Enable CrowdSec Web UI stack at boot
  ansible.builtin.systemd:
    name: admin-stack@crowdsec-web-ui.service
    enabled: true
