---
- name: Read existing Keycloak credential from OpenBao
  ansible.builtin.uri:
    url: "{{ openbao_config_url }}/v1/{{ openbao_keycloak_credential.mount }}/data/{{ openbao_keycloak_credential.path }}"
    method: GET
    headers:
      X-Vault-Token: "{{ openbao_config_token }}"
    validate_certs: "{{ openbao_config_validate_certs }}"
    status_code: [200, 404]
  register: openbao_keycloak_credential_current
  changed_when: false
  no_log: true

- name: Write updated Keycloak credential to OpenBao
  ansible.builtin.uri:
    url: "{{ openbao_config_url }}/v1/{{ openbao_keycloak_credential.mount }}/data/{{ openbao_keycloak_credential.path }}"
    method: POST
    headers:
      X-Vault-Token: "{{ openbao_config_token }}"
    body_format: json
    body:
      data: "{{ openbao_keycloak_credential.data }}"
    validate_certs: "{{ openbao_config_validate_certs }}"
    status_code: [200, 204]
  when: >-
    openbao_keycloak_credential_current.status == 404
    or (openbao_keycloak_credential_current.json.data.data | default({})) != openbao_keycloak_credential.data
  no_log: true
