#cloud-config
groups:
  - homelab

users:
  - name: admin
    groups: [wheel, homelab]
    shell: /bin/bash
    sudo: ["ALL=(ALL) NOPASSWD:ALL"]
    ssh_authorized_keys:
      - "ssh-ed25519 AAAA_PLACEHOLDER_REPLACE_ME admin@example"

package_update: true
package_upgrade: true
packages:
  - ansible
  - git
  - docker
  - docker-compose
  - go
  - openssh
  - rsync
  - sops
  - age
  - restic
  - jq
  - curl
  - make
  - python
  - sudo
  - nftables
  - fail2ban
  - audit
  - lynis

write_files:
  - path: /etc/admin-node/mode
    owner: root:root
    permissions: '0644'
    content: |
      locked
  - path: /usr/local/bin/admin-node-install-release
    owner: root:root
    permissions: '0755'
    content: |
      #!/usr/bin/env bash
      set -euo pipefail
      repo_url="${1:?repository URL is required}"
      requested_ref="${2:?release tag or commit is required}"
      qualification_url="${3:-}"
      qualification_sha256="${4:-}"
      install_channel="${5:-production}"
      repo_dir="${REPO_DIR:-/opt/homelab-admin-node}"
      if [[ "$requested_ref" == "RELEASE_REF_REPLACE_ME" ]]; then
        echo "[cloud-init] replace RELEASE_REF_REPLACE_ME with an immutable release tag or full commit SHA" >&2
        exit 2
      fi
      if [[ ! -d "$repo_dir/.git" ]]; then
        git clone --no-checkout "$repo_url" "$repo_dir" || {
          echo "[cloud-init] initial clone failed for $repo_dir using $repo_url" >&2
          echo "[cloud-init] verify repository access/authentication and network connectivity" >&2
          exit 1
        }
      fi
      if [[ "$requested_ref" == "main" ]]; then
        git -C "$repo_dir" fetch origin main
        if git -C "$repo_dir" show-ref --verify --quiet refs/heads/main; then
          git -C "$repo_dir" checkout main
        else
          git -C "$repo_dir" checkout --track -b main origin/main
        fi
        git -C "$repo_dir" branch --set-upstream-to origin/main main
        resolved_ref="$(git -C "$repo_dir" rev-parse 'HEAD^{commit}')"
        persisted_ref="main"
      elif [[ "$requested_ref" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
        tag_ref="refs/tags/$requested_ref"
        git -C "$repo_dir" fetch origin "$tag_ref:$tag_ref"
        if [[ "$(git -C "$repo_dir" cat-file -t "$tag_ref")" != "tag" ]]; then
          echo "[cloud-init] release tag $requested_ref must be annotated" >&2
          exit 2
        fi
        resolved_ref="$(git -C "$repo_dir" rev-parse "$tag_ref^{commit}")"
        git -C "$repo_dir" checkout --detach "$resolved_ref"
        persisted_ref="$resolved_ref"
      elif [[ "$requested_ref" =~ ^[0-9a-f]{40}$ ]]; then
        if [[ "$install_channel" != ci ]]; then
          echo "[cloud-init] direct commit installation is reserved for the explicit CI channel; production requires a qualified tag" >&2
          exit 2
        fi
        git -C "$repo_dir" fetch origin "$requested_ref"
        resolved_ref="$(git -C "$repo_dir" rev-parse 'FETCH_HEAD^{commit}')"
        if [[ "$resolved_ref" != "$requested_ref" ]]; then
          echo "[cloud-init] fetched commit $resolved_ref does not match requested pin $requested_ref" >&2
          exit 2
        fi
        git -C "$repo_dir" checkout --detach "$resolved_ref"
        persisted_ref="$resolved_ref"
      else
        echo "[cloud-init] release ref must be main, an annotated vMAJOR.MINOR.PATCH tag, or a lowercase full commit SHA" >&2
        exit 2
      fi
      qualification_state=/etc/admin-node/qualification.json
      if [[ "$requested_ref" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
        if [[ ! "$repo_url" =~ ^https://github.com/([^/]+)/([^/]+)$ ]]; then
          echo "[cloud-init] production qualification requires an HTTPS github.com repository URL" >&2
          exit 2
        fi
        repository_owner="${BASH_REMATCH[1]}"
        repository_name="${BASH_REMATCH[2]%.git}"
        expected_qualification_url="https://github.com/$repository_owner/$repository_name/releases/download/$requested_ref/qualification.json"
        if [[ "$qualification_url" != "$expected_qualification_url" || ! "$qualification_sha256" =~ ^[0-9a-f]{64}$ ]]; then
          echo "[cloud-init] production tag requires $expected_qualification_url and its lowercase SHA-256" >&2
          exit 2
        fi
        qualification_tmp="$(mktemp)"
        release_metadata_tmp="$(mktemp)"
        trap 'rm -f "$qualification_tmp" "$release_metadata_tmp"' EXIT
        curl --fail --location --proto '=https' --tlsv1.2 \
          --output "$release_metadata_tmp" \
          "https://api.github.com/repos/$repository_owner/$repository_name/releases/tags/$requested_ref"
        curl --fail --location --proto '=https' --tlsv1.2 --output "$qualification_tmp" "$qualification_url"
        printf '%s  %s\n' "$qualification_sha256" "$qualification_tmp" | sha256sum --check --strict
        (cd "$repo_dir" && python3 scripts/verify-installed-release.py \
          "$qualification_tmp" --release-metadata "$release_metadata_tmp" \
          --tag "$requested_ref" --commit "$resolved_ref" --manifest-sha256 "$qualification_sha256")
        install -m 0644 "$qualification_tmp" "$qualification_state"
      else
        rm -f "$qualification_state"
      fi
      case "$requested_ref" in
        main) release_channel=development ;;
        v*) release_channel=production ;;
        *) release_channel=ci ;;
      esac
      printf '%s\n' "$release_channel" > /etc/admin-node/release-channel
      printf '%s\n' "$requested_ref" > /etc/admin-node/release-name
      printf '%s\n' "$persisted_ref" > /etc/admin-node/release-ref
  - path: /usr/local/bin/admin-node-converge
    owner: root:root
    permissions: '0755'
    content: |
      #!/usr/bin/env bash
      set -euo pipefail
      REPO_DIR="${REPO_DIR:-/opt/homelab-admin-node}"
      BUILD_PATH="$REPO_DIR/scripts/build-admin-node.sh"
      BIN_PATH="$REPO_DIR/bin/admin-node"
      if [[ -x "$BUILD_PATH" ]]; then
        "$BUILD_PATH"
      fi
      if [[ -x "$BIN_PATH" ]]; then
        exec "$BIN_PATH" converge run
      fi
      echo "[admin-converge] $BIN_PATH not found"
      echo "[admin-converge] initial clone should be done by cloud-init into $REPO_DIR"
      exit 1
  - path: /etc/systemd/system/admin-converge.service
    owner: root:root
    permissions: '0644'
    content: |
      [Unit]
      Description=Admin node ansible converge
      After=network-online.target
      Wants=network-online.target

      [Service]
      Type=oneshot
      UMask=0027
      Environment=GOCACHE=/var/cache/admin-node/go-build
      Environment=GOMODCACHE=/var/cache/admin-node/go-mod
      Environment=GOPATH=/var/cache/admin-node/go-path
      ExecStart=/usr/local/bin/admin-node-converge
  - path: /etc/systemd/system/admin-converge.timer
    owner: root:root
    permissions: '0644'
    content: |
      [Unit]
      Description=Periodic admin converge

      [Timer]
      OnBootSec=5min
      OnUnitActiveSec=30min
      Unit=admin-converge.service

      [Install]
      WantedBy=timers.target

runcmd:
  - [ mkdir, -p, /etc/admin-node ]
  - [ /usr/local/bin/admin-node-install-release, 'https://github.com/Frantche/homelab-admin-node.git', 'RELEASE_REF_REPLACE_ME', 'QUALIFICATION_MANIFEST_URL_REPLACE_ME', 'QUALIFICATION_MANIFEST_SHA256_REPLACE_ME' ]
  - [ systemctl, daemon-reload ]
  - [ systemctl, enable, --now, sshd ]
  - [ systemctl, enable, --now, docker ]
  - [ systemctl, enable, --now, admin-converge.timer ]

power_state:
  mode: reboot
  message: Reboot after the Arch rolling-release upgrade
  timeout: 120
  condition: true
