#cloud-config
groups:
  - homelab

users:
  - name: admin
    groups: [wheel, homelab]
    shell: /bin/bash
    sudo: ["ALL=(ALL) NOPASSWD:ALL"]
    ssh_authorized_keys:
      - "ssh-ed25519 AAAA_PLACEHOLDER_REPLACE_ME admin@example"

package_update: true
package_upgrade: true
packages:
  - ansible
  - git
  - docker
  - docker-compose
  - go
  - openssh
  - rsync
  - sops
  - age
  - restic
  - jq
  - curl
  - make
  - python
  - sudo
  - nftables
  - fail2ban
  - audit
  - lynis

bootcmd:
  - |
      set -eu
      snapshot='ARCH_PACKAGE_SNAPSHOT_REPLACE_ME'
      snapshot_mode="$(cat /etc/admin-node/package-snapshot-mode)"
      case "$snapshot" in
        live)
          if [ "$snapshot_mode" != ci-live ]; then
            echo "[cloud-init] live Arch mirrors are permitted only in explicitly rendered CI user-data" >&2
            exit 2
          fi
          server='https://geo.mirror.pkgbuild.com/$repo/os/$arch'
          ;;
        [0-9][0-9][0-9][0-9]/[0-9][0-9]/[0-9][0-9])
          if [ "$snapshot_mode" != qualified ]; then
            echo "[cloud-init] a qualified snapshot requires package-snapshot-mode=qualified" >&2
            exit 2
          fi
          server="https://archive.archlinux.org/repos/$snapshot/\$repo/os/\$arch"
          ;;
        *)
          echo "[cloud-init] replace ARCH_PACKAGE_SNAPSHOT_REPLACE_ME with the qualified YYYY/MM/DD Arch snapshot" >&2
          exit 2
          ;;
      esac
      printf 'Server = %s\n' "$server" > /etc/pacman.d/mirrorlist

write_files:
  - path: /etc/admin-node/mode
    owner: root:root
    permissions: '0644'
    content: |
      locked
  - path: /etc/admin-node/package-snapshot-mode
    owner: root:root
    permissions: '0644'
    content: |
      qualified
  - path: /usr/local/bin/admin-node-record-package-snapshot
    owner: root:root
    permissions: '0755'
    content: |
      #!/usr/bin/env bash
      set -euo pipefail
      snapshot='ARCH_PACKAGE_SNAPSHOT_REPLACE_ME'
      mode="$(tr -d '[:space:]' < /etc/admin-node/package-snapshot-mode)"
      if [[ "$snapshot" == live && "$mode" != ci-live ]]; then
        echo "[cloud-init] refusing to record live package state outside CI" >&2
        exit 2
      fi
      if [[ "$snapshot" != live && ! "$snapshot" =~ ^[0-9]{4}/[0-9]{2}/[0-9]{2}$ ]]; then
        echo "[cloud-init] invalid qualified package snapshot: $snapshot" >&2
        exit 2
      fi
      printf '%s\n' "$snapshot" > /etc/admin-node/package-snapshot
  - path: /usr/local/bin/admin-node-install-release
    owner: root:root
    permissions: '0755'
    content: |
      #!/usr/bin/env bash
      set -euo pipefail
      repo_url="${1:?repository URL is required}"
      requested_ref="${2:?release tag or commit is required}"
      repo_dir="${REPO_DIR:-/opt/homelab-admin-node}"
      if [[ "$requested_ref" == "RELEASE_REF_REPLACE_ME" ]]; then
        echo "[cloud-init] replace RELEASE_REF_REPLACE_ME with an immutable release tag or full commit SHA" >&2
        exit 2
      fi
      if [[ ! -d "$repo_dir/.git" ]]; then
        git clone --no-checkout "$repo_url" "$repo_dir" || {
          echo "[cloud-init] initial clone failed for $repo_dir using $repo_url" >&2
          echo "[cloud-init] verify repository access/authentication and network connectivity" >&2
          exit 1
        }
      fi
      if [[ "$requested_ref" == "main" ]]; then
        git -C "$repo_dir" fetch origin main
        if git -C "$repo_dir" show-ref --verify --quiet refs/heads/main; then
          git -C "$repo_dir" checkout main
        else
          git -C "$repo_dir" checkout --track -b main origin/main
        fi
        git -C "$repo_dir" branch --set-upstream-to origin/main main
        resolved_ref="$(git -C "$repo_dir" rev-parse 'HEAD^{commit}')"
        persisted_ref="main"
      elif [[ "$requested_ref" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
        tag_ref="refs/tags/$requested_ref"
        git -C "$repo_dir" fetch origin "$tag_ref:$tag_ref"
        if [[ "$(git -C "$repo_dir" cat-file -t "$tag_ref")" != "tag" ]]; then
          echo "[cloud-init] release tag $requested_ref must be annotated" >&2
          exit 2
        fi
        resolved_ref="$(git -C "$repo_dir" rev-parse "$tag_ref^{commit}")"
        git -C "$repo_dir" checkout --detach "$resolved_ref"
        persisted_ref="$resolved_ref"
      elif [[ "$requested_ref" =~ ^[0-9a-f]{40}$ ]]; then
        git -C "$repo_dir" fetch origin "$requested_ref"
        resolved_ref="$(git -C "$repo_dir" rev-parse 'FETCH_HEAD^{commit}')"
        if [[ "$resolved_ref" != "$requested_ref" ]]; then
          echo "[cloud-init] fetched commit $resolved_ref does not match requested pin $requested_ref" >&2
          exit 2
        fi
        git -C "$repo_dir" checkout --detach "$resolved_ref"
        persisted_ref="$resolved_ref"
      else
        echo "[cloud-init] release ref must be main, an annotated vMAJOR.MINOR.PATCH tag, or a lowercase full commit SHA" >&2
        exit 2
      fi
      printf '%s\n' "$requested_ref" > /etc/admin-node/release-name
      printf '%s\n' "$persisted_ref" > /etc/admin-node/release-ref
  - path: /usr/local/bin/admin-node-converge
    owner: root:root
    permissions: '0755'
    content: |
      #!/usr/bin/env bash
      set -euo pipefail
      REPO_DIR="${REPO_DIR:-/opt/homelab-admin-node}"
      BUILD_PATH="$REPO_DIR/scripts/build-admin-node.sh"
      BIN_PATH="$REPO_DIR/bin/admin-node"
      if [[ -x "$BUILD_PATH" ]]; then
        "$BUILD_PATH"
      fi
      if [[ -x "$BIN_PATH" ]]; then
        exec "$BIN_PATH" converge run
      fi
      echo "[admin-converge] $BIN_PATH not found"
      echo "[admin-converge] initial clone should be done by cloud-init into $REPO_DIR"
      exit 1
  - path: /etc/systemd/system/admin-converge.service
    owner: root:root
    permissions: '0644'
    content: |
      [Unit]
      Description=Admin node ansible converge
      After=network-online.target
      Wants=network-online.target

      [Service]
      Type=oneshot
      UMask=0027
      Environment=GOCACHE=/var/cache/admin-node/go-build
      Environment=GOMODCACHE=/var/cache/admin-node/go-mod
      Environment=GOPATH=/var/cache/admin-node/go-path
      ExecStart=/usr/local/bin/admin-node-converge
  - path: /etc/systemd/system/admin-converge.timer
    owner: root:root
    permissions: '0644'
    content: |
      [Unit]
      Description=Periodic admin converge

      [Timer]
      OnBootSec=5min
      OnUnitActiveSec=30min
      Unit=admin-converge.service

      [Install]
      WantedBy=timers.target

runcmd:
  - [ mkdir, -p, /etc/admin-node ]
  - [ /usr/local/bin/admin-node-record-package-snapshot ]
  - [ /usr/local/bin/admin-node-install-release, 'https://github.com/Frantche/homelab-admin-node.git', 'RELEASE_REF_REPLACE_ME' ]
  - [ systemctl, daemon-reload ]
  - [ systemctl, enable, --now, sshd ]
  - [ systemctl, enable, --now, docker ]
  - [ systemctl, enable, --now, admin-converge.timer ]

power_state:
  mode: reboot
  message: Reboot after the Arch rolling-release upgrade
  timeout: 120
  condition: true
